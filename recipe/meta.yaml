{% set name = "flask-socketio" %}
{% set version = "5.7.0" %}

package:
  name: {{ name }}
  version: {{ version }}

source:
  url: https://pypi.org/packages/source/{{ name[0] }}/{{ name }}/{{ name|lower|replace('-', '_') }}-{{ version }}.tar.gz
  sha256: aa01e50106962808dadc245407c3b6354295b1526e888bd154dc7ff4801a7c88

build:
  number: 0
  script: {{ PYTHON }} -m pip install . -vv --no-deps --no-build-isolation
  skip: true  # [py<38]

requirements:
  host:
    - pip
    - python
    - wheel
    - setuptools >=61.2
  run:
    - python
    - blinker
    - click
    - flask >=2.1.0
    - jinja2
    - python-socketio >=5.12.0
    - werkzeug

test:
  source_files:
    - test_socketio.py
  imports:
    - flask_socketio
    - flask_socketio.namespace
    - flask_socketio.test_client
  requires:
    - pip
    - redis-py
    - pytest
  commands:
    - pip check
    - python -c "from importlib.metadata import version; assert(version('{{ name }}')=='{{ version }}')"
    - pytest -vv test_socketio.py

about:
  home: https://github.com/miguelgrinberg/flask-socketio
  license: MIT
  license_file: LICENSE
  license_family: MIT
  summary: Socket.IO integration for Flask applications.
  description: |
    Flask-SocketIO gives Flask applications access to low latency bi-directional
    communications between the clients and the server. The client-side application can
    use any of the SocketIO client libraries in Javascript, Python, C++, Java and Swift,
    or any other compatible client to establish a permanent connection to the server.
  dev_url: https://github.com/miguelgrinberg/flask-socketio
  doc_url: https://flask-socketio.readthedocs.io

extra:
  recipe-maintainers:
    - pmlandwehr
    - synapticarbors
